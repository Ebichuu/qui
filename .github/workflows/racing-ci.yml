name: Racing CI

on:
  push:
    branches:
      - racing/develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: racing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qui_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build frontend and backend
        run: make build
      - name: Run Go tests
        env:
          QUI_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/qui_test?sslmode=disable
        run: go test -race -count=1 -timeout 20m ./...
      - name: Run frontend tests
        working-directory: web
        run: pnpm test
      - name: Verify isolated startup and authentication
        run: make smoke-baseline
      - name: Verify Q1 configuration lifecycle
        run: make smoke-racing
      - name: Verify reception and restart recovery
        run: make smoke-racing-execution
      - name: Verify reception fault isolation and timing
        run: make smoke-racing-integration
      - name: Verify automation observation crash recovery
        run: make smoke-automation-observation
