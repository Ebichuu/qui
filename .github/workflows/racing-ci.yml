name: Racing CI

on:
  push:
    branches:
      - racing/develop
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish an amd64 acceptance image after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: racing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qui_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: web/package.json
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build frontend and backend
        run: make build
      - name: Run Go tests
        env:
          QUI_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/qui_test?sslmode=disable
        run: go test -race -count=1 -timeout 20m ./...
      - name: Report native Linux allocation evidence
        run: go test -race -count=1 -v ./pkg/fileallocation
      - name: Verify native official reclaim execution and restart
        run: |
          truncate -s 256M "$RUNNER_TEMP/qui-reclaim.ext4"
          mkfs.ext4 -q -F "$RUNNER_TEMP/qui-reclaim.ext4"
          mkdir -p "$RUNNER_TEMP/qui-reclaim-fs"
          sudo mount -o loop "$RUNNER_TEMP/qui-reclaim.ext4" "$RUNNER_TEMP/qui-reclaim-fs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/qui-reclaim-fs"
          trap 'sudo umount "$RUNNER_TEMP/qui-reclaim-fs"' EXIT
          QUI_RECLAIM_TEST_ROOT="$RUNNER_TEMP/qui-reclaim-fs" python3 scripts/smoke-reclaim-execution.py
      - name: Run frontend tests
        working-directory: web
        run: pnpm test
      - name: Verify isolated startup and authentication
        run: make smoke-baseline
      - name: Verify Q1 configuration lifecycle
        run: make smoke-racing
      - name: Verify reception and restart recovery
        run: make smoke-racing-execution
      - name: Verify reception fault isolation and timing
        run: make smoke-racing-integration
      - name: Verify automation observation crash recovery
        run: make smoke-automation-observation
      - name: Verify reclaim configuration inheritance and recovery
        run: make smoke-reclaim-settings
      - name: Verify automatic delete ownership and restart recovery
        run: make smoke-automatic-delete
      - name: Verify official candidate observation and isolation
        run: make smoke-reclaim-candidates
      - name: Verify official shortage assessment without deletion
        run: make smoke-reclaim-assessment
      - name: Verify tracker retry outcomes
        run: make smoke-reannounce-result
      - name: Verify tracker account constraints
        run: make smoke-reannounce-policies
      - name: Verify bounded Peer history and independent reception
        run: make smoke-racing-analysis
      - name: Verify shared reannounce entry points
        run: make smoke-reannounce-shared

      - name: Upload validated frontend for image publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image
        uses: actions/upload-artifact@v7
        with:
          name: racing-web-dist
          path: internal/web/dist
          retention-days: 3

  publish:
    name: Publish isolated acceptance image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image && github.ref == 'refs/heads/racing/develop'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: racing-web-dist
          path: internal/web/dist
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/ebichuu/qui
          tags: type=raw,value=racing-${{ github.sha }}
          flavor: latest=false
      - name: Build and publish validated image
        id: image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: distrib/docker/ci.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=racing-${{ github.sha }}
            REVISION=${{ github.sha }}
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: false
      - name: Record deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Acceptance image ghcr.io/ebichuu/qui@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
